#
# Marlin Firmware
# PlatformIO Configuration File
#
# tx3m - Longer LK4 Pro fork
#
# Same build as env:mega2560, plus a version number from git and a named firmware file.
# See buildroot/share/PlatformIO/scripts/lk4pro_version.py
#

# Stock LK4 Pro (A4988 extruder driver)
[env:LK4Pro]
extends       = env:mega2560
extra_scripts = ${common.extra_scripts}
  pre:buildroot/share/PlatformIO/scripts/lk4pro_version.py

# Extruder driver replaced with a silent TMC2208 (LKPro_SILENT_E_DRIVER)
[env:LK4Pro_SilentE]
extends       = env:LK4Pro
build_flags   = ${common_avr8.build_flags} -DLKPro_SILENT_E_DRIVER
